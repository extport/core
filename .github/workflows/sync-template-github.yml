name: Sync Template GitHub Config

on:
  repository_dispatch:
    types: [template-github-changed]
  workflow_dispatch:

jobs:
  sync:
    name: Sync .github/ to mirror repos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6.5.0
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Sync template .github/ to all mirrors
        run: node scripts/sync-template-github.js
        env:
          GITHUB_TOKEN: ${{ secrets.EXTPORT_BOT_TOKEN }}
