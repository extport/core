name: Sync Template GitHub Config

on:
  repository_dispatch:
    types: [template-github-changed]
  workflow_dispatch:

jobs:
  sync:
    name: Sync .github/ to mirror repos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Sync template .github/ to all mirrors
        run: node scripts/sync-template-github.js
        env:
          GITHUB_TOKEN: ${{ secrets.EXTPORT_BOT_TOKEN }}
